name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  helper:
    name: helper (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          # macos-13 (Intel) hosted-runner capacity has been withdrawn; jobs
          # pinned to it queue forever. macos-14 cross-links x86_64-apple-darwin
          # natively from its Apple Silicon host, so this only changes the
          # build machine, not the target.
          - { name: macos-x64, os: macos-14, target: x86_64-apple-darwin }
          - { name: macos-arm64, os: macos-14, target: aarch64-apple-darwin }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Format check
        run: cargo fmt --manifest-path helper/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy -p pypilot-helper --locked --target ${{ matrix.target }} -- -D warnings

      - name: Build helper
        run: cargo build -p pypilot-helper --release --locked --target ${{ matrix.target }}

      - name: Test helper
        run: cargo test -p pypilot-helper --locked --target ${{ matrix.target }}

  extension:
    name: WASM shim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (wasm)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Build extension (wasm)
        run: cargo build -p pypilot-zed --target wasm32-wasip2 --release --locked

  scripts:
    name: release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Self-test bump_engine_pins.py
        # Oldest and newest Python the pip wrapper supports (uv ships 3.8
        # builds that setup-python no longer has for ubuntu-latest).
        run: |
          uv run --no-project --python 3.8 python scripts/bump_engine_pins.py --self-test
          uv run --no-project --python 3.15 python scripts/bump_engine_pins.py --self-test
